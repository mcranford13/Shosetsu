name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;37.0.0"

      - name: Verify tests, lint, and builds
        run: ./gradlew :android:testStandardDebugUnitTest :android:lintStandardDebug :android:assembleStandardDebug :android:assembleStandardRelease --stacktrace
