name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # v3 installs the SDK "tools" package, which Google no longer publishes.
      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;37.0.0"

      # Packaging the debug APK reads the sherpa and onnx libraries into the Gradle
      # heap. Keep that off the release shrinker, which needs the same heap.
      - name: Verify tests, lint, and the debug build
        run: ./gradlew :android:testStandardDebugUnitTest :android:lintStandardDebug :android:assembleStandardDebug --stacktrace

      - name: Verify the release build
        run: ./gradlew :android:assembleStandardRelease --stacktrace
